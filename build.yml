name: Build Windows EXE + MSI
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: "x86"
      - run: pip install -r requirements.txt
      - name: Make logo and icon
        run: python make_assets.py
      - name: Build app (folder)
        run: pyinstaller --onedir --windowed --noupx --paths src --hidden-import ui --hidden-import calculators --hidden-import rates --hidden-import letter --icon assets/icon.ico --add-data "assets/logo.png;assets" --add-data "assets/icon.ico;assets" --name PostOfficeCalculator src/main.py
      - name: Build debug version (shows errors)
        run: pyinstaller --onedir --console --noupx --paths src --hidden-import ui --hidden-import calculators --hidden-import rates --hidden-import letter --icon assets/icon.ico --add-data "assets/logo.png;assets" --add-data "assets/icon.ico;assets" --name PostOfficeDebug src/main.py

      - name: Build MSI installer
        shell: pwsh
        run: |
          # MSI versions must be numeric (a.b.c) - strip the leading "v" from tags like v1.2.0
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v?(\d+\.\d+\.\d+)') { $ver = $Matches[1] } else { $ver = "1.0.0" }
          Write-Host "MSI version: $ver"

          # Pinned on purpose: newer WiX majors need extra licence/EULA acceptance
          dotnet tool install --global wix --version 5.0.2
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"

          python make_wxs.py dist/PostOfficeCalculator PostOfficeCalculator.exe $ver
          wix build -arch x86 installer.wxs -o PostOfficeCalculator.msi
          if (-not (Test-Path PostOfficeCalculator.msi)) { throw "MSI was not created" }

      - name: Zip both
        run: |
          Compress-Archive -Path dist/PostOfficeCalculator -DestinationPath PostOfficeCalculator.zip
          Compress-Archive -Path dist/PostOfficeDebug -DestinationPath PostOfficeDebug.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PostOfficeCalculator
          path: |
            PostOfficeCalculator.msi
            PostOfficeCalculator.zip
            PostOfficeDebug.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PostOfficeCalculator.msi
            PostOfficeCalculator.zip
            PostOfficeDebug.zip
